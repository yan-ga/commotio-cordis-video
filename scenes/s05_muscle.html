<script src="lib.js"></script>

<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/"}}</script>
<script type="module">
// Part 5, the muscle cell. 3D: push into the bottom-chamber wall, through striped muscle cells, onto one
// cell's skin, which flattens into the 2D membrane strip. 2D: the cell sits flat and negative; a knock
// arrives, the fast sodium doors fling open and it fires (GO); calcium pours in (SQUEEZE) and we dive into
// the 3D strands: calcium pops the locks off and the heads row, then the whole 3D heart squeezes. Back in
// 2D potassium pours out (RESET), calcium is pumped away and the strands relax. Summary card at the end.
import * as L3 from './lib3d.js';
import { loadHeart, createStage as createHeartStage, beat, beatAt } from './heart3d.js';
const { THREE } = L3;
const G = window.G2;
const TAU = Math.PI * 2;
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const wt = wordAt;
const T = {
  there: wt(0, 'down there'), unlike: wt(0, 'Unlike'), noLeak: wt(0, "it doesn't"), sits: wt(0, 'It sits'), neg: wt(0, 'negative'), wait: wt(0, 'waiting'),
  c1: cs(1), fast: wt(1, 'its fast'), fling: wt(1, 'fling'), floods: wt(1, 'Sodium floods'), fires: wt(1, 'fires.'),
  c2: cs(2), caDoor: wt(2, 'calcium pours'), sigSq: wt(2, 'Calcium is'), signal: wt(2, 'signal'), unlocks: wt(2, 'It unlocks'), tiny: wt(2, 'and tiny'), rowers: wt(2, 'like rowers'),
  billions: wt(2, 'Billions'), makeOne: wt(2, 'make one'),
  c3: cs(3), resets: wt(3, 'the cell resets'), pumped: wt(3, 'the calcium'), relax: wt(3, 'and the muscle'),
  c4: cs(4), sGo: wt(4, 'sodium says'), sSq: wt(4, 'Calcium says'), sReset: wt(4, 'Potassium says'),
};
// Shot boundaries.
const SH = {
  cells: T.there - 0.05, mem: T.noLeak - 0.15, flat0: T.sits - 0.05, flat1: T.sits + 0.45,
  to2D0: T.sits + 0.3, to2D1: T.sits + 0.6,
  zoom0: T.sigSq + 0.85, zoomMid: T.sigSq + 1.15, zoom1: T.sigSq + 1.5,
  heart: T.billions, back0: ce(2) - 0.15, back1: cs(3) - 0.05,
  sum0: ce(3) - 0.1, sum1: cs(4) + 0.3,
};

// ================================================================ shared 2D bits (s08 style)
function stateKey(ctx, x, y, alpha) {
  if (alpha <= 0) return;
  // The lockout is not explained until s06, so no padlocks and no locked state here.
  const items = [['Ready', 'unlocked'], ['Firing', 'firing']];
  const w = 290, rowH = 58, h = items.length * rowH + 24;
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.fillStyle = 'rgba(5,10,30,0.66)'; roundRect(ctx, x, y, w, h, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 2; ctx.stroke();
  items.forEach(([label, st], k) => {
    const cy = y + 12 + rowH * (k + 0.5);
    if (st === 'firing') glow(ctx, x + 62, cy, 50, C.spark, 0.6);
    G.brick(ctx, x + 62, cy, 76, 44, st, { padlock: false });
    text(ctx, label, x + 120, cy + 1, 32, C.text, 'left', 700);
  });
  ctx.restore();
}
function title(ctx, s, alpha, size = 50) { text(ctx, s, 80, 88, size, C.text, 'left', 700, alpha); }
function whiteout(ctx, a) { if (a > 0) { ctx.fillStyle = `rgba(255,235,225,${0.55 * a})`; ctx.fillRect(0, 0, W, H); } }
const smooth01 = p => (p = clamp(p), p * p * (3 - 2 * p));

// ================================================================ 3D: lib3d stage (cells, membrane, strands)
const stage = L3.createStage({ bloom: true, dof: { aperture: 0.0014, maxblur: 0.006 } });
const S3 = stage.scene;

const cellsG = new THREE.Group(); cellsG.position.set(100, 0, 0); S3.add(cellsG);
const sheet = L3.createCellSheet({ cols: 5, rows: 4, seed: 4 });
cellsG.add(sheet.group);
const HERO = sheet.index(1, 2);

// Membrane patch: door x positions are the 2D strip's door positions at 70 px per unit.
const MEM_Y = 450, STRIP = { x0: 80, x1: 1080, cx: 580 }, PPU = 70;
const DOORX = { na: 250, ca: 520, k: 920, pump: 720 };
const memG = new THREE.Group(); memG.position.set(200, 0, 0); S3.add(memG);
const memW = new THREE.Group(); memG.add(memW);
const mem = L3.createMembrane({
  width: 15.4, depth: 7, seed: 6,
  doors: ['na', 'ca', 'k'].map(kind => ({ kind, x: (DOORX[kind] - STRIP.cx) / PPU, z: 2.6 })),
});
memW.add(mem.group);
const ionNa = L3.createIons('na', 26), ionCa = L3.createIons('ca', 12), ionK = L3.createIons('k', 18);
memW.add(ionNa.group, ionCa.group, ionK.group);

const sarcG = new THREE.Group(); sarcG.position.set(400, 0, 0); S3.add(sarcG);
const sarc = L3.createSarcomere({ heads: 3 });
sarcG.add(sarc.group);
// The lock knobs all sit on one side of the strand; turn the strand about its own axis so they face us.
sarc.actin.rotation.x = -2.85;
sarc.update(0, { locks: 1, engage: 0 });
const lockMeshes = sarc.actin.children.slice(3).filter(o => o.isMesh);
const LOCKS = lockMeshes.map(m => ({ home: m.position.clone(), dir: V(0, m.position.y, m.position.z).normalize() }));
// The stock knobs are small and dark maroon, lost against the night-blue background. Here they carry the
// "unlocks" beat, so they take the video's locked red and a little extra size.
for (const m of lockMeshes) {
  m.material.color.set(C.locked);
  if (m.material.emissive) { m.material.emissive.set('#a0142c'); m.material.emissiveIntensity = 0.35; }
}
const LOCK_SIZE = 1.5;
const CA_LOCKS = [3, 4, 5, 6];
const caS = L3.createIons('ca', CA_LOCKS.length, { radius: 0.16 });
sarc.group.add(caS.group);

function showOnly(name) {
  cellsG.visible = name === 'cells';
  memG.visible = name === 'mem';
  sarcG.visible = name === 'sarc';
}
function cam(pos, target, fov = 34) {
  stage.setCamera({ pos, target, fov });
  stage.focusOn(target);
}

// ---- cells: push through the striped cells to one of them
function cellShot(t) {
  showOnly('cells');
  sheet.reset();
  const p = L3.ease(seg(t, SH.cells - 0.3, SH.mem + 0.2));
  const c = sheet.cells[HERO];
  const tg = V(100 + c.x, c.y, 0);
  const from = V(100 + c.x + 3.4, c.y + 2.6, 9.5), to = V(100 + c.x + 0.9, c.y + 1.0, 4.4);
  cam(from.clone().lerp(to, p), tg.clone().add(V(0.4 * (1 - p), 0, 0)), 34);
}

// ---- membrane: the hero cell's skin, doors shut, then flattened into the 2D strip
function memShot(t) {
  showOnly('mem');
  const tc = Math.min(t, SH.flat0);
  mem.update(tc, { wave: 1 - seg(t, SH.flat0, SH.flat1) });
  for (const d of mem.doors) d.set({ open: 0 });
  let n = 0;
  for (const v of L3.ionCloud(11, 26, { min: [-7.2, 1.7, -3], max: [7.2, 3.1, 3.2] }, t, 0.2)) ionNa.set(n++, v);
  ionNa.hideFrom(n); ionNa.commit();
  n = 0;
  for (const v of L3.ionCloud(12, 12, { min: [-7.2, 1.7, -3], max: [7.2, 3.1, 3.2] }, t, 0.2)) ionCa.set(n++, v);
  ionCa.hideFrom(n); ionCa.commit();
  n = 0;
  for (const v of L3.ionCloud(13, 18, { min: [-7.2, -3.1, -3], max: [7.2, -1.7, 3.2] }, t, 0.2)) ionK.set(n++, v);
  ionK.hideFrom(n); ionK.commit();
  const lt = Math.min(t, SH.flat0) - SH.mem;
  cam(V(200 + 0.8 - lt * 0.15, 3.6 - lt * 0.2, 12.8 - lt * 0.35), V(200, -0.1, 1.6), 34);
  L3.flatten(memW, stage, seg(t, SH.flat0, SH.flat1), { center: [STRIP.cx, MEM_Y], pxPerUnit: PPU, thin: 0.06 });
  stage.focusOn(memW.getWorldPosition(V(0, 0, 0)));
}

// ---- strands: calcium arrives, pops the locks, heads row and the strand slides
const SLIDE0 = -2.6, ROW_RATE = 0.55;
const rowCycles = t => ROW_RATE * Math.max(0, t - (T.tiny + 0.1));
const strandSlide = t => SLIDE0 + rowCycles(t) * sarc.stroke / 0.43;
function lockPoint(k, out = 0.3) {
  const L = LOCKS[k];
  return L.home.clone().addScaledVector(L.dir, out).applyMatrix4(sarc.actin.matrix);
}
const caArrive = i => T.sigSq + 1.35 + i * 0.22;
function sarcShot(t) {
  showOnly('sarc');
  const locks = 1 - L3.ease(seg(t, T.unlocks + 0.05, T.unlocks + 1.3));
  const engage = L3.ease(seg(t, T.tiny - 0.2, T.tiny + 0.35));
  sarc.update(rowCycles(t), { engage, locks, slide: strandSlide(t) });
  for (const m of lockMeshes) m.scale.multiplyScalar(LOCK_SIZE);
  sarc.actin.updateMatrix();
  CA_LOCKS.forEach((k, i) => {
    // Calcium settles just beside its knob, so the knob stays in view until it pops off.
    const end = lockPoint(k, 0.15).add(V(0.42, 0.12, 0));
    const t1 = caArrive(i), p = L3.ease(seg(t, t1 - 1.1, t1));
    const start = end.clone().add(V(1.2 + 0.3 * i, 2.6, 2.2));
    const pos = start.lerp(end, p).add(L3.jitter(i + 5, t, 0.06 * (1 - p) + 0.015));
    caS.set(i, pos, 1);
  });
  caS.commit();
  const lt = t - (SH.zoom0 + 0.2);
  cam(V(400 + 0.9 - lt * 0.12, -0.35, 8.0 - lt * 0.2), V(400, -0.78, 0), 34);
}

// ================================================================ 3D: the real heart (heart3d stage)
const hStage = createHeartStage();
const heart = await loadHeart(hStage.renderer);
hStage.scene.add(heart.group);

function heartCam(pos, target, fov = 30) {
  hStage.camera.position.copy(pos);
  hStage.camera.fov = fov; hStage.camera.updateProjectionMatrix();
  hStage.camera.lookAt(target);
}
const orbitPos = (yaw, pitch, dist, target) => {
  const y = THREE.MathUtils.degToRad(yaw), p = THREE.MathUtils.degToRad(pitch);
  return target.clone().add(V(Math.sin(y) * Math.cos(p) * dist, Math.sin(p) * dist, Math.cos(y) * Math.cos(p) * dist));
};
// Opening: the heart beating calmly, the camera pushing in on the wall of the bottom chambers.
// The push lands on bare muscle a little below the wall anchor, clear of the coronary vessels.
function wallSpot() {
  heart.group.updateMatrixWorld();
  const a = heart.anchors, an = heart.anchorNormals;
  const wall = heart.group.localToWorld(a.lvWall.clone().lerp(a.apex, 0.4));
  const n = an.lvWall.clone().lerp(an.apex, 0.4).normalize().transformDirection(heart.group.matrixWorld);
  return { wall, n };
}
function heartOpen(t) {
  heart.group.scale.setScalar(1);
  heart.update({ t, ...beatAt(t, 64, 0.3) });
  const { wall, n } = wallSpot();
  const p = L3.ease(seg(t, 0.5, SH.cells + 0.1));
  const t0 = V(0, -0.05, 0), p0 = orbitPos(-8, 5, 4.9, t0);
  const p1 = wall.clone().addScaledVector(n, 0.85);
  heartCam(p0.lerp(p1, p), t0.lerp(wall, L3.ease(seg(t, 0.3, SH.cells - 0.4))), 30);
  hStage.render(t);
}
// "Billions of tiny pulls make one heartbeat": pull back out of the wall, then one strong squeeze.
const squeezePh = t => clamp((t - (T.makeOne - 0.05)) * 0.9, -0.5, 0.99);
function heartSqueeze(t) {
  const b = beat(squeezePh(t));
  // The one heartbeat has to read at a glance, so the whole heart also tightens a little on the squeeze.
  heart.group.scale.setScalar(1 - 0.05 * b.squeezeV);
  heart.update({ t, ...b });
  const { wall, n } = wallSpot();
  const p = L3.ease(seg(t, SH.heart - 0.2, SH.heart + 0.9));
  const tEnd = V(-0.62, -0.05, 0);
  const p0 = wall.clone().addScaledVector(n, 0.7), p1 = orbitPos(-6 + 4 * seg(t, SH.heart, SH.back1), 4, 4.9, tEnd);
  heartCam(p0.lerp(p1, p), wall.clone().lerp(tEnd, p), 30);
  hStage.render(t);
}

// ================================================================ 2D: ions
const ionsOut = { na: [], ca: [] }, ionsIn = [];
for (let i = 0; i < 18; i++) ionsOut.na.push([115 + rand(i * 3 + 1) * 950, 228 + rand(i * 3 + 2) * 72]);
for (let i = 0; i < 10; i++) ionsOut.ca.push([115 + rand(i * 3 + 201) * 950, 228 + rand(i * 3 + 202) * 72]);
for (let i = 0; i < 12; i++) ionsIn.push([130 + rand(i * 5 + 50) * 900, 560 + rand(i * 5 + 51) * 100]);
const jit = (i, t, a = 1) => [5 * a * Math.sin(t * 1.4 + i * 2.1), 4 * a * Math.sin(t * 1.9 + i * 1.3)];
// Position along a polyline at arc-length fraction p.
function along(pts, p) {
  const segs = [];
  let total = 0;
  for (let k = 1; k < pts.length; k++) { const d = Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]); segs.push(d); total += d; }
  let s = clamp(p) * total;
  for (let k = 0; k < segs.length; k++) {
    if (s <= segs[k] || k === segs.length - 1) { const q = segs[k] ? clamp(s / segs[k]) : 1; return [lerp(pts[k][0], pts[k + 1][0], q), lerp(pts[k][1], pts[k + 1][1], q)]; }
    s -= segs[k];
  }
  return pts[pts.length - 1];
}
const doorTop = x => [x, MEM_Y - 95], doorBot = x => [x, MEM_Y + 95];

// Strand glyph (inside the cell): actin rows from each end, myosin bar in the middle.
const SX = 580, SY = 778;
const zxOf = c => lerp(400, 318, c);
// Calcium binding spots on the actin rows; they slide with the actin.
function caSpot(i, c) {
  const side = i < 4 ? -1 : 1, row = i % 2 ? 1 : -1, off = [80, 210][(i >> 1) & 1], zx = zxOf(c);
  return [side < 0 ? SX - zx + off : SX + zx - off, SY + row * 40];
}
const NA_FLOOD = 14, CA_IN = 8, K_OUT = 7;
const naStart = i => T.fling + 0.2 + i * 0.065;
const caStart = i => T.c2 + 0.3 + i * 0.14;
const caPumpStart = i => T.pumped + 0.3 + i * 0.14;
const kStart = i => T.c3 + 0.35 + i * 0.13;

function drawIons(ctx, t, alpha, c) {
  if (alpha <= 0) return;
  // Sodium: waiting outside, a share floods in through the fast door.
  ionsOut.na.forEach((h, i) => {
    const j = jit(i, t);
    let p = [h[0] + j[0], h[1] + j[1]];
    if (i < NA_FLOOD) {
      const q = seg(t, naStart(i), naStart(i) + 0.75);
      if (q > 0) {
        const end = [130 + rand(i * 7 + 90) * 560, 560 + rand(i * 7 + 91) * 120];
        const ej = jit(i + 40, t, 0.8);
        p = along([p, doorTop(DOORX.na), doorBot(DOORX.na), [end[0] + ej[0], end[1] + ej[1]]], q * q * (3 - 2 * q));
      }
    }
    // As the cell resets, most of the sodium that flooded in fades away, so the inside reads negative again.
    const gone = i < NA_FLOOD && i % 5 !== 3 ? seg(t, T.resets - 0.3 + i * 0.07, T.resets + 0.3 + i * 0.07) : 0;
    ion(ctx, p[0], p[1], 'na', 14, alpha * (1 - gone));
  });
  // Calcium: waiting outside, pours in onto the strands, later pumped back out.
  ionsOut.ca.forEach((h, i) => {
    const j = jit(i + 20, t);
    let p = [h[0] + j[0], h[1] + j[1]];
    if (i < CA_IN) {
      const q = seg(t, caStart(i), caStart(i) + 1.2);
      const spot = caSpot(i, c);
      if (q > 0) p = along([p, doorTop(DOORX.ca), doorBot(DOORX.ca), spot], smooth01(q));
      const r = seg(t, caPumpStart(i), caPumpStart(i) + 1.3);
      if (r > 0) {
        const out = [DOORX.pump - 150 + i * 42, 236 + rand(i + 300) * 60];
        const oj = jit(i + 60, t, 0.8);
        p = along([spot, doorBot(DOORX.pump), doorTop(DOORX.pump), [out[0] + oj[0], out[1] + oj[1]]], smooth01(r));
      }
    }
    ion(ctx, p[0], p[1], 'ca', 14, alpha);
  });
  // Potassium: inside, a share pours out through its door.
  ionsIn.forEach((h, i) => {
    const j = jit(i + 80, t);
    let p = [h[0] + j[0], h[1] + j[1]];
    if (i < K_OUT) {
      const q = seg(t, kStart(i), kStart(i) + 1.0);
      if (q > 0) {
        const out = [800 + rand(i + 400) * 260, 232 + rand(i + 401) * 66];
        const oj = jit(i + 90, t, 0.8);
        p = along([p, doorBot(DOORX.k), doorTop(DOORX.k), [out[0] + oj[0], out[1] + oj[1]]], smooth01(q));
      }
    }
    ion(ctx, p[0], p[1], 'k', 14, alpha);
  });
}

// Charge signs inside the cell: minus at rest, plus once sodium floods in, minus again after the reset.
function drawCharge(ctx, t, alpha) {
  if (alpha <= 0) return;
  const pos = seg(t, T.floods + 0.1, T.floods + 0.9) * (1 - seg(t, T.resets - 0.2, T.resets + 0.7));
  for (let k = 0; k < 9; k++) {
    const x = 150 + k * 106, y = 676 + 14 * Math.sin(k * 1.7);
    ctx.save(); ctx.globalAlpha *= alpha * 0.8 * (1 - pos); ctx.fillStyle = '#8fb8ff'; roundRect(ctx, x - 16, y - 4, 32, 8, 4); ctx.fill(); ctx.restore();
    ctx.save(); ctx.globalAlpha *= alpha * 0.8 * pos; ctx.fillStyle = '#ffffff'; roundRect(ctx, x - 16, y - 4, 32, 8, 4); ctx.fill(); roundRect(ctx, x - 4, y - 16, 8, 32, 4); ctx.fill(); ctx.restore();
  }
}

function strand2D(ctx, c, alpha) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha;
  const zx = zxOf(c);
  // myosin heads first, under the bar
  for (let k = -6; k <= 6; k++) {
    if (k === 0) continue;
    const s = Math.sign(k), x = SX + k * 35;
    for (const side of [-1, 1]) {
      ctx.save(); ctx.translate(x + s * 5, SY + side * 20); ctx.rotate(s * side * 0.55);
      ctx.fillStyle = '#e6b04f'; ctx.beginPath(); ctx.ellipse(0, 0, 7, 13, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
  const g = ctx.createLinearGradient(0, SY - 11, 0, SY + 11);
  g.addColorStop(0, '#f0c46a'); g.addColorStop(1, '#a97a2c');
  ctx.fillStyle = g; roundRect(ctx, SX - 240, SY - 11, 480, 22, 11); ctx.fill();
  // actin bead chains
  for (const side of [-1, 1]) for (const row of [-1, 1]) {
    const y = SY + row * 40;
    for (let b = 0; b < 22; b++) {
      const x = side < 0 ? SX - zx + 8 + b * 14 : SX + zx - 8 - b * 14;
      const yy = y + 3 * Math.sin(b * 1.3);
      ctx.fillStyle = '#e88c78'; ctx.beginPath(); ctx.arc(x, yy, 8, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.arc(x - 2.5, yy - 2.5, 3, 0, TAU); ctx.fill();
    }
  }
  // end plates
  ctx.strokeStyle = '#ff9db0'; ctx.lineWidth = 7; ctx.lineJoin = 'round';
  for (const side of [-1, 1]) {
    const x = SX + side * zx;
    ctx.beginPath();
    for (let k = 0; k <= 8; k++) { const y = SY - 72 + k * 18; const xx = x + (k % 2 ? 9 : -9); k ? ctx.lineTo(xx, y) : ctx.moveTo(xx, y); }
    ctx.stroke();
  }
  ctx.restore();
}

function pump2D(ctx, x, y, t, alpha) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha;
  const g = ctx.createLinearGradient(x - 46, 0, x + 46, 0);
  g.addColorStop(0, '#36c48a'); g.addColorStop(1, '#1d7f58');
  ctx.fillStyle = g; roundRect(ctx, x - 46, y - 64, 92, 128, 30); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2; ctx.stroke();
  // turning arrow
  const a0 = t * 2.4;
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y, 24, a0, a0 + 4.6); ctx.stroke();
  const ax = x + 24 * Math.cos(a0 + 4.6), ay = y + 24 * Math.sin(a0 + 4.6), ang = a0 + 4.6 + Math.PI / 2;
  ctx.fillStyle = '#ffffff'; ctx.beginPath();
  ctx.moveTo(ax + Math.cos(ang) * 12, ay + Math.sin(ang) * 12);
  ctx.lineTo(ax + Math.cos(ang + 2.3) * 11, ay + Math.sin(ang + 2.3) * 11);
  ctx.lineTo(ax + Math.cos(ang - 2.3) * 11, ay + Math.sin(ang - 2.3) * 11);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ================================================================ 2D: graph
// Trace progress u (0..0.96) against scene time. It keeps running (unseen) while we are in 3D.
const GRAPH_W = [[T.sits - 0.1, 0], [T.c1, 0.15], [T.floods + 0.15, 0.2], [T.fires - 0.15, 0.25], [T.c2, 0.29], [SH.zoom0 + 0.3, 0.42],
  [SH.back0, 0.56], [T.c3 + 1.1, 0.62], [T.resets + 0.75, 0.8], [ce(3), 0.95]];
const graphU = G.warp(GRAPH_W);
function volt(u) {
  if (u < 0.2) return -90;
  if (u < 0.25) { const p = (u - 0.2) / 0.05; return -90 + 125 * (1 - (1 - p) * (1 - p)); }
  if (u < 0.29) return lerp(35, 12, smooth01((u - 0.25) / 0.04));
  if (u < 0.62) { const p = (u - 0.29) / 0.33; return lerp(12, -6, p * p); }
  if (u < 0.8) return lerp(-6, -90, smooth01((u - 0.62) / 0.18));
  return -90;
}

// ================================================================ 2D: the cell row (neighbour, this cell, neighbour)
const ROW = { y: 318, w: 150, h: 90, xs: [1290, 1510, 1730] };

const HOLD1 = T.c2 - 0.1;

  if (t < FIRE_END[i]) return { st: { level: 0, open: 1, fire: 1 }, dim: 0 };

// ================================================================ main
function draw(ctx, t) {
  // ---- cue 0: heart -> cells -> membrane (3D)
  if (t < SH.cells) {
    heartOpen(t);
    ctx.drawImage(hStage.canvas, 0, 0);
    const wsp = wallSpot().wall.project(hStage.camera); const wp = { x: (wsp.x + 1) * W / 2, y: (1 - wsp.y) * H / 2, facing: 1 };
    const ra = env(t, 0.9, SH.cells - 0.15, 0.35);
    if (ra > 0 && wp.facing > 0) {
      const rr = 54 + 30 * seg(t, 0.9, SH.cells) + 6 * Math.sin(t * 6);
      ctx.save(); ctx.globalAlpha = ra; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 5; ctx.shadowColor = 'rgba(160,220,255,0.9)'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(wp.x, wp.y, rr, 0, TAU); ctx.stroke(); ctx.restore();
    }
    whiteout(ctx, Math.sin(Math.PI * seg(t, SH.cells - 0.4, SH.cells + 0.4)));
  } else if (t < SH.mem) {
    cellShot(t);
    stage.frame(ctx);
    whiteout(ctx, Math.sin(Math.PI * seg(t, SH.cells - 0.4, SH.cells + 0.4)));
    // Outline the one cell we are heading for.
    const oa = env(t, SH.cells + 0.05, SH.mem, 0.2);
    if (oa > 0) {
      const box = new THREE.Box3().setFromObject(sheet.cells[HERO].mesh);
      const pts = [];
      for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) pts.push(stage.toScreen(V(x, y, z)));
      const x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x)), y0 = Math.min(...pts.map(p => p.y)), y1 = Math.max(...pts.map(p => p.y));
      ctx.save(); ctx.globalAlpha = oa; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 5; ctx.setLineDash([16, 12]);
      roundRect(ctx, x0 - 10, y0 - 10, x1 - x0 + 20, y1 - y0 + 20, 30); ctx.stroke(); ctx.restore();
      G.tag(ctx, 'one muscle cell', (x0 + x1) / 2, Math.max(70, y0 - 50), { size: 36, alpha: oa });
    }
    whiteout(ctx, Math.sin(Math.PI * seg(t, SH.mem - 0.4, SH.mem + 0.4)));
  } else if (t < SH.to2D1) {
    memShot(t);
    stage.frame(ctx, 1 - seg(t, SH.to2D0 + 0.1, SH.to2D1));
    whiteout(ctx, Math.sin(Math.PI * seg(t, SH.mem - 0.4, SH.mem + 0.4)));
    const la = env(t, T.noLeak - 0.1, SH.to2D1, 0.3);
    G.tag(ctx, 'doors shut: no leak', W / 2, 150, { size: 40, alpha: la });
  }

  // ---- cue 2: strands (3D) then the heart squeezing
  if (t > SH.zoom0 && t < SH.heart + 0.25) {
    sarcShot(t);
    stage.frame(ctx, seg(t, SH.zoomMid, SH.zoom1));
    // Name the calcium on one ion, tracked in flight.
    const m4 = new THREE.Matrix4(); caS.spheres.getMatrixAt(1, m4);
    const p1 = stage.toScreen(caS.group.localToWorld(new THREE.Vector3().setFromMatrixPosition(m4)));
    G.tag(ctx, 'calcium', p1.x + 130, p1.y - 70, { size: 34, color: C.ca, alpha: env(t, SH.zoom1 - 0.2, T.unlocks + 0.2, 0.3), to: [p1.x + 14, p1.y - 12] });
    G.tag(ctx, 'calcium unlocks the strand', W / 2, 80, { size: 42, alpha: env(t, T.unlocks + 0.05, T.tiny - 0.1, 0.2) });
    G.tag(ctx, 'tiny heads grab and pull', W / 2, 80, { size: 42, alpha: env(t, T.tiny, T.rowers, 0.3) });
    G.tag(ctx, 'like rowers', W / 2, 80, { size: 42, alpha: env(t, T.rowers, SH.heart + 0.1, 0.3) });
    const pa = env(t, T.tiny + 0.3, SH.heart, 0.3);
    if (pa > 0) {
      // The strand slides: an arrow along it.
      const a = stage.toScreen(sarcG.localToWorld(V(-1.6, 0.8, 0))), b = stage.toScreen(sarcG.localToWorld(V(1.6, 0.8, 0)));
      ctx.save(); ctx.globalAlpha = pa; ctx.strokeStyle = '#ffffff'; ctx.fillStyle = '#ffffff'; ctx.lineWidth = 8; ctx.lineCap = 'round';
      ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x - 20, b.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(b.x + 18, b.y); ctx.lineTo(b.x - 18, b.y - 20); ctx.lineTo(b.x - 18, b.y + 20); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    whiteout(ctx, Math.sin(Math.PI * seg(t, SH.heart - 0.35, SH.heart + 0.35)));
  }
  if (t >= SH.heart && t < SH.back1) {
    heartSqueeze(t);
    ctx.save(); ctx.globalAlpha = 1 - seg(t, SH.back0, SH.back0 + 0.25); ctx.drawImage(hStage.canvas, 0, 0); ctx.restore();
    whiteout(ctx, Math.sin(Math.PI * seg(t, SH.heart - 0.35, SH.heart + 0.35)));
    // The words leave fully before the 2D view starts to come in.
    const ta = 1 - seg(t, SH.back0 - 0.55, SH.back0 - 0.15);
    const sg = ctx.createLinearGradient(0, 0, 760, 0);
    sg.addColorStop(0, 'rgba(6,11,34,0.78)'); sg.addColorStop(0.6, 'rgba(6,11,34,0.45)'); sg.addColorStop(1, 'rgba(6,11,34,0)');
    ctx.save(); ctx.globalAlpha = ta * seg(t, SH.heart, SH.heart + 0.2); ctx.fillStyle = sg; ctx.fillRect(0, 0, 760, 950); ctx.restore();
    text(ctx, 'Billions of', 110, 420, 56, C.text, 'left', 800, ta * seg(t, SH.heart, SH.heart + 0.2));
    text(ctx, 'tiny pulls', 110, 492, 56, C.text, 'left', 800, ta * seg(t, SH.heart, SH.heart + 0.2));
    text(ctx, '= one heartbeat', 110, 600, 64, '#ff9fb0', 'left', 800, ta * seg(t, T.makeOne - 0.05, T.makeOne + 0.4));
  }

  // ---- 2D (cues 0 to 3), zooming into the strands before the 3D dive
  const a2 = Math.min(seg(t, SH.to2D0, SH.to2D1), 1) * (t < SH.heart ? 1 - seg(t, SH.zoom0, SH.zoomMid) : seg(t, SH.back0 + 0.3, SH.back1 + 0.1));
  if (a2 > 0) {

    const z = t < SH.heart ? L3.ease(seg(t, SH.zoom0 - 0.15, SH.zoomMid)) : 0;

    ctx.restore();

  whiteout(ctx, Math.sin(Math.PI * seg(t, SH.back0, SH.back1 + 0.1)));
  // Drawn over the dive into the strands so it stays up through "squeeze", then hands over to the unlock line.
  G.tag(ctx, 'the signal to squeeze', W / 2, 80, { size: 42, color: C.ca, alpha: env(t, T.signal - 0.2, T.unlocks + 0.05, 0.2) });
}
